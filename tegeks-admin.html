<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin Lengkap — Nevfa Store</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #8b2cf5;
      --primary-hover: #7922db;
      --primary-gradient: linear-gradient(135deg, #a855f7 0%, #8b2cf5 50%, #6d28d9 100%);
      --bg: #09090b;
      --card-bg: #121216;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .admin-container { max-width: 1000px; margin: 0 auto; }

    .admin-header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px 30px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      flex-wrap: wrap;
      gap: 15px;
    }

    .admin-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
    }
    .admin-title span { color: #c084fc; }

    .admin-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px 30px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .admin-card h3 {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-card p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 12px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }

    textarea.form-control { height: 95px; resize: vertical; }

    .btn-purple {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(139,44,245,0.3);
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-purple:hover { transform: translateY(-2px); opacity: 0.9; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

    .btn-success {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 10px 20px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .variant-row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      align-items: center;
    }

    .product-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .alert-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 13.5px;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <div class="admin-title">⚙️ Nevfa Store <span>Panel Admin Pro</span></div>
      <div style="display: flex; gap: 10px;">
        <button class="btn-success" onclick="saveData()">💾 Simpan & Download JSON</button>
        <a href="index.html" target="_blank" class="btn-purple">🌐 Buka Web Toko</a>
      </div>
    </div>

    <div class="alert-box" id="alertBox">✅ Berhasil! File <b>products.json</b> otomatis ter-download. Masukkan ke folder project kamu.</div>

    <!-- KELOLA PRODUK -->
    <div class="admin-card">
      <h3>
        📦 Kelola Katalog Produk, Benefit, Garansi & Varian
        <button class="btn-purple" onclick="addProduct()" style="padding: 6px 14px; font-size: 12px;">+ Tambah Produk Baru</button>
      </h3>
      <p>Edit nama, logo, harga mulai, deskripsi, benefit, garansi, deskripsi lengkap, dan paket varian secara bebas.</p>
      
      <div id="productListContainer"></div>
    </div>
  </div>

  <script>
    let currentProducts = [
      {
        id: "netflix",
        title: "Netflix",
        logo: "netflix.png",
        startPrice: "Rp20.000",
        desc: "Streaming film & series favorit dengan kualitas terbaik.",
        benefit: "Streaming Ultra HD 4K anti lemot, support TV & HP, legal resmi.",
        garansi: "Garansi full sesuai durasi berlangganan.",
        deskripsi: "Akun Netflix resmi berkualitas tinggi anti hold.",
        packages: [
          { nama: "Sharing 1 Bulan", harga: "Rp20.000" },
          { nama: "Anti Limit 1 Bulan", harga: "Rp40.000" },
          { nama: "Private 1 Bulan", harga: "Rp110.000" }
        ]
      },
      {
        id: "canva",
        title: "Canva Pro",
        logo: "canva.png",
        startPrice: "Rp8.000",
        desc: "Desain tanpa batas dengan semua fitur premium Canva.",
        benefit: "Akses semua template pro, elemen pro, hapus latar belakang otomatis, dan kit merek.",
        garansi: "Garansi invite ulang jika link tim kendala selama masa aktif.",
        deskripsi: "Akun Canva Pro via link invite resmi team edu/enterprise.",
        packages: [
          { nama: "Invite Member 1 Bulan", harga: "Rp8.000" },
          { nama: "Invite Member 1 Tahun", harga: "Rp25.000" }
        ]
      }
    ];

    async function loadAdminData() {
      try {
        const res = await fetch('products.json?v=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            currentProducts = data;
          }
        }
      } catch (e) {
        console.log("Memuat dari default/lokal");
      }
      renderAdminList();
    }

    function renderAdminList() {
      const container = document.getElementById('productListContainer');
      container.innerHTML = '';

      currentProducts.forEach((prod, pIdx) => {
        let pkgHtml = '';
        if (prod.packages) {
          prod.packages.forEach((pkg, pkgIdx) => {
            pkgHtml += `
              <div class="variant-row">
                <input type="text" class="form-control" value="${pkg.nama}" oninput="updatePkg(${pIdx}, ${pkgIdx}, 'nama', this.value)" placeholder="Nama Paket (cth: Sharing 1 Bulan)">
                <input type="text" class="form-control" value="${pkg.harga}" oninput="updatePkg(${pIdx}, ${pkgIdx}, 'harga', this.value)" placeholder="Harga (cth: Rp20.000)">
                <button class="btn-danger" onclick="removePkg(${pIdx}, ${pkgIdx})">✕</button>
              </div>
            `;
          });
        }

        container.innerHTML += `
          <div class="product-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
              <h4 style="color:#c084fc; font-size:16px; font-weight:800;">📦 ${prod.title || 'Produk Baru'}</h4>
              <button class="btn-danger" onclick="removeProduct(${pIdx})">🗑️ Hapus Produk</button>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
              <div class="form-group">
                <label>Nama Produk:</label>
                <input type="text" class="form-control" value="${prod.title || ''}" oninput="updateProd(${pIdx}, 'title', this.value)">
              </div>
              <div class="form-group">
                <label>Nama File Logo (.png):</label>
                <input type="text" class="form-control" value="${prod.logo || ''}" oninput="updateProd(${pIdx}, 'logo', this.value)">
              </div>
              <div class="form-group">
                <label>Harga Mulai Dari:</label>
                <input type="text" class="form-control" value="${prod.startPrice || ''}" oninput="updateProd(${pIdx}, 'startPrice', this.value)">
              </div>
              <div class="form-group">
                <label>Deskripsi Singkat (Katalog):</label>
                <input type="text" class="form-control" value="${prod.desc || ''}" oninput="updateProd(${pIdx}, 'desc', this.value)">
              </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; margin-top:8px;">
              <div class="form-group">
                <label>Benefit:</label>
                <textarea class="form-control" oninput="updateProd(${pIdx}, 'benefit', this.value)">${prod.benefit || ''}</textarea>
              </div>
              <div class="form-group">
                <label>Garansi:</label>
                <textarea class="form-control" oninput="updateProd(${pIdx}, 'garansi', this.value)">${prod.garansi || ''}</textarea>
              </div>
              <div class="form-group">
                <label>Deskripsi Lengkap:</label>
                <textarea class="form-control" oninput="updateProd(${pIdx}, 'deskripsi', this.value)">${prod.deskripsi || ''}</textarea>
              </div>
            </div>

            <div class="form-group" style="margin-top:10px;">
              <label style="color:#c084fc;">⚡ Varian Paket & Harga:</label>
              <div id="pkgs-${pIdx}">${pkgHtml}</div>
              <button class="btn-purple" onclick="addPkg(${pIdx})" style="padding: 6px 14px; font-size:12px; margin-top:6px;">+ Tambah Varian Paket</button>
            </div>
          </div>
        `;
      });
    }

    function updateProd(pIdx, field, val) {
      currentProducts[pIdx][field] = val;
    }

    function addProduct() {
      currentProducts.push({
        id: "prod_" + Date.now(),
        title: "Produk Baru",
        logo: "logo.png",
        startPrice: "Rp10.000",
        desc: "Deskripsi singkat produk baru.",
        benefit: "Fitur Pro dan legal.",
        garansi: "Garansi penuh.",
        deskripsi: "Deskripsi lengkap produk baru.",
        packages: [
          { nama: "Paket 1 Bulan", harga: "Rp10.000" }
        ]
      });
      renderAdminList();
    }

    function removeProduct(pIdx) {
      if (confirm("Yakin ingin menghapus produk ini dari katalog?")) {
        currentProducts.splice(pIdx, 1);
        renderAdminList();
      }
    }

    function updatePkg(pIdx, pkgIdx, field, val) {
      currentProducts[pIdx].packages[pkgIdx][field] = val;
    }

    function addPkg(pIdx) {
      if (!currentProducts[pIdx].packages) {
        currentProducts[pIdx].packages = [];
      }
      currentProducts[pIdx].packages.push({ nama: "Paket Baru", harga: "Rp15.000" });
      renderAdminList();
    }

    function removePkg(pIdx, pkgIdx) {
      currentProducts[pIdx].packages.splice(pkgIdx, 1);
      renderAdminList();
    }

    function saveData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentProducts, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "products.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();

      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => { alertBox.style.display = 'none'; }, 5000);
    }

    window.onload = loadAdminData;
  </script>
</body>
</html>
