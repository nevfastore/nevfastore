<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel Utama — Nevfa Store</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #8b2cf5;
      --primary-hover: #7922db;
      --primary-gradient: linear-gradient(135deg, #a855f7 0%, #8b2cf5 50%, #6d28d9 100%);
      --bg: #09090b;
      --card-bg: #121216;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .admin-container { max-width: 1000px; margin: 0 auto; }

    .admin-header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px 30px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      flex-wrap: wrap;
      gap: 15px;
    }

    .admin-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
    }
    .admin-title span { color: #c084fc; }

    .admin-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px 30px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .admin-card h3 {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-card p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 12px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }

    textarea.form-control { height: 95px; resize: vertical; }

    .btn-purple {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(139,44,245,0.3);
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-purple:hover { transform: translateY(-2px); opacity: 0.9; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

    .btn-success {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 10px 20px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .variant-row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      align-items: center;
    }

    .product-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .alert-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 13.5px;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <div class="admin-title">⚙️ Nevfa Store <span>Panel Admin</span></div>
      <div style="display: flex; gap: 10px;">
        <button class="btn-success" onclick="saveData()">💾 Simpan & Perbarui Web</button>
        <a href="index.html" target="_blank" class="btn-purple">🌐 Buka Web Toko</a>
      </div>
    </div>

    <div class="alert-box" id="alertBox">✅ Perubahan berhasil disimpan secara real-time! Silakan cek web toko utama.</div>

    <!-- KELOLA PRODUK -->
    <div class="admin-card">
      <h3>
        📦 Kelola Katalog Produk & Varian Paket
        <button class="btn-purple" onclick="addProduct()" style="padding: 6px 14px; font-size: 12px;">+ Tambah Produk Baru</button>
      </h3>
      <p>Edit nama produk, logo, harga mulai, deskripsi, benefit, garansi, serta paket harganya di sini.</p>
      
      <div id="productListContainer"></div>
    </div>
  </div>

  <script>
    const defaultProducts = [
      {
        id: "netflix",
        title: "Netflix",
        logo: "netflix.png",
        startPrice: "Rp20.000",
        desc: "Streaming film & series favorit dengan kualitas terbaik.",
        benefit: "• Streaming Ultra HD 4K anti lemot\n• Support Smart TV, HP, & Laptop\n• Legal resmi dan aman anti hold",
        garansi: "• Garansi penuh selama durasi berlangganan\n• Pergantian akun langsung jika terjadi kendala",
        deskripsi: "Akun Netflix resmi berkualitas tinggi siap pakai untuk hiburan keluarga.",
        packages: [
          { nama: "Sharing 1 Bulan", harga: "Rp20.000" },
          { nama: "Anti Limit 1 Bulan", harga: "Rp40.000" },
          { nama: "Private 1 Bulan", harga: "Rp110.000" }
        ]
      },
      {
        id: "canva",
        title: "Canva Pro",
        logo: "canva.png",
        startPrice: "Rp8.000",
        desc: "Desain tanpa batas dengan semua fitur premium Canva.",
        benefit: "• Akses semua template & elemen Pro\n• Fitur hapus latar belakang otomatis\n• Brand kit & penyimpanan besar",
        garansi: "• Garansi invite ulang jika link tim bermasalah\n• Full support masa aktif",
        deskripsi: "Akun Canva Pro via link invite resmi tim Edu/Enterprise anti ribet.",
        packages: [
          { nama: "Invite Member 1 Bulan", harga: "Rp8.000" },
          { nama: "Invite Member 1 Tahun", harga: "Rp25.000" }
        ]
      },
      {
        id: "capcut",
        title: "CapCut Pro",
        logo: "capcut.png",
        startPrice: "Rp10.000",
        desc: "Edit video profesional dengan efek dan template pro.",
        benefit: "• Buka semua efek pro & transisi premium\n• Export video tanpa watermark",
        garansi: "• Garansi penggantian akun baru jika terjadi kendala login",
        deskripsi: "Akun CapCut Pro siap pakai untuk editing video sosmed.",
        packages: [
          { nama: "Sharing 1 Bulan", harga: "Rp10.000" },
          { nama: "Private 1 Bulan", harga: "Rp35.000" }
        ]
      },
      {
        id: "youtube",
        title: "YouTube Premium",
        logo: "youtube.png",
        startPrice: "Rp25.000",
        desc: "Tanpa iklan, bisa background play dan download.",
        benefit: "• Bebas iklan total di semua perangkat\n• Putar video di latar belakang / HP terkunci\n• Akses YouTube Music",
        garansi: "• Garansi full 1 bulan anti putus di tengah jalan",
        deskripsi: "YouTube Premium legal via invite keluarga atau akun baru.",
        packages: [
          { nama: "Famplan Invite 1 Bulan", harga: "Rp10.000" },
          { nama: "Indplan 1 Bulan", harga: "Rp25.000" }
        ]
      },
      {
        id: "vidio",
        title: "Vidio Platinum",
        logo: "vidio.png",
        startPrice: "Rp20.000",
        desc: "Nonton liga, sinema, dan tayangan eksklusif Vidio.",
        benefit: "• Streaming Liga Champions & Premier League\n• Sinema lokal & serial Korea pilihan",
        garansi: "• Garansi full durasi sesuai paket",
        deskripsi: "Akun Vidio Platinum resmi dan aman.",
        packages: [
          { nama: "Platinum Mobile 30 Hari", harga: "Rp35.000" },
          { nama: "Platinum All Device 30 Hari", harga: "Rp45.000" }
        ]
      },
      {
        id: "wetv",
        title: "WeTV VIP",
        logo: "wetv.png",
        startPrice: "Rp15.000",
        desc: "Drama Asia terbaru tanpa iklan, kualitas HD.",
        benefit: "• Nonton episode lebih awal tanpa iklan\n• Kualitas video jernih HD",
        garansi: "• Garansi pergantian akun baru jika error",
        deskripsi: "WeTV VIP legal anti limit.",
        packages: [
          { nama: "VIP Sharing 1 Bulan", harga: "Rp15.000" },
          { nama: "VIP Private 1 Bulan", harga: "Rp35.000" }
        ]
      },
      {
        id: "iqiyi",
        title: "iQIYI",
        logo: "iqiyi.png",
        startPrice: "Rp9.000",
        desc: "Serial dan film Asia lengkap dengan subtitle Indonesia.",
        benefit: "• Akses drama China & Korea eksklusif\n• Bebas iklan tanpa jeda",
        garansi: "• Garansi full aman selama masa aktif",
        deskripsi: "Akun iQIYI VIP resmi.",
        packages: [
          { nama: "VIP Standard 1 Bulan", harga: "Rp9.000" },
          { nama: "VIP Premium 1 Bulan", harga: "Rp18.000" }
        ]
      },
      {
        id: "viu",
        title: "VIU",
        logo: "viu.png",
        startPrice: "Rp5.000",
        desc: "Drama Korea dan Asia dengan harga paling terjangkau.",
        benefit: "• Download sepuasnya & bebas iklan\n• Update drama on-going tercepat",
        garansi: "• Garansi penggantian akun jika kendala login",
        deskripsi: "Akun Viu Premium private aman.",
        packages: [
          { nama: "Premium Private 1 Bulan", harga: "Rp5.000" },
          { nama: "Premium Private 3 Bulan", harga: "Rp12.000" }
        ]
      },
      {
        id: "prime",
        title: "Prime Video",
        logo: "prime.png",
        startPrice: "Rp15.000",
        desc: "Streaming film blockbuster dan Amazon Originals.",
        benefit: "• Kualitas HDR/4K dengan subtitle Indonesia lengkap\n• Akses ribet film eksklusif",
        garansi: "• Garansi full sesuai durasi",
        deskripsi: "Prime Video legal resmi.",
        packages: [
          { nama: "Sharing 1 Bulan", harga: "Rp15.000" },
          { nama: "Private 1 Bulan", harga: "Rp30.000" }
        ]
      },
      {
        id: "loklok",
        title: "Loklok",
        logo: "loklok.png",
        startPrice: "Rp15.000",
        desc: "Nonton anime, drama, dan film tanpa batas dengan kualitas HD.",
        benefit: "• Bebas iklan total\n• Akses semua anime dan film VIP terbaru",
        garansi: "• Garansi penggantian akun baru jika bermasalah",
        deskripsi: "Loklok VIP legal anti gangguan.",
        packages: [
          { nama: "VIP 1 Bulan", harga: "Rp15.000" },
          { nama: "VIP 3 Bulan", harga: "Rp35.000" }
        ]
      },
      {
        id: "hbo",
        title: "HBO GO",
        logo: "hbo.png",
        startPrice: "Rp25.000",
        desc: "Tayangan sinema Hollywood, HBO Originals, dan DC Universe.",
        benefit: "• Streaming film box office Hollywood terbaru\n• Kualitas video HD terbaik",
        garansi: "• Garansi full durasi berlangganan",
        deskripsi: "HBO GO resmi dan terpercaya.",
        packages: [
          { nama: "Sharing 1 Bulan", harga: "Rp25.000" },
          { nama: "Private 1 Bulan", harga: "Rp50.000" }
        ]
      }
    ];

    let currentProducts = defaultProducts;

    function loadAdminData() {
      const saved = localStorage.getItem('nevfa_custom_products');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            currentProducts = parsed;
          }
        } catch(e){}
      }
      renderAdminList();
    }

    function renderAdminList() {
      const container = document.getElementById('productListContainer');
      container.innerHTML = '';

      currentProducts.forEach((prod, pIdx) => {
        let pkgHtml = '';
        if (prod.packages) {
          prod.packages.forEach((pkg, pkgIdx) => {
            pkgHtml += `
              <div class="variant-row">
                <input type="text" class="form-control" value="${pkg.nama}" oninput="updatePkg(${pIdx}, ${pkgIdx}, 'nama', this.value)" placeholder="Nama Paket (cth: 1 Bulan)">
                <input type="text" class="form-control" value="${pkg.harga}" oninput="updatePkg(${pIdx}, ${pkgIdx}, 'harga', this.value)" placeholder="Harga (cth: Rp20.000)">
                <button class="btn-danger" onclick="removePkg(${pIdx}, ${pkgIdx})">✕</button>
              </div>
            `;
          });
        }

        container.innerHTML += `
          <div class="product-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
              <h4 style="color:#c084fc; font-size:16px; font-weight:800;">📦 ${prod.title || 'Produk Baru'}</h4>
              <button class="btn-danger" onclick="removeProduct(${pIdx})">🗑️ Hapus Produk</button>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
              <div class="form-group">
                <label>Nama Produk:</label>
                <input type="text" class="form-control" value="${prod.title || ''}" oninput="updateProd(${pIdx}, 'title', this.value)">
              </div>
              <div class="form-group">
                <label>Nama File Logo (.png):</label>
                <input type="text" class="form-control" value="${prod.logo || ''}" oninput="updateProd(${pIdx}, 'logo', this.value)">
              </div>
              <div class="form-group">
                <label>Harga Mulai Dari:</label>
                <input type="text" class="form-control" value="${prod.startPrice || ''}" oninput="updateProd(${pIdx}, 'startPrice', this.value)">
              </div>
              <div class="form-group">
                <label>Deskripsi Singkat (Katalog):</label>
                <input type="text" class="form-control" value="${prod.desc || ''}" oninput="updateProd(${pIdx}, 'desc', this.value)">
              </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; margin-top:8px;">
              <div class="form-group">
                <label>Benefit (Gunakan baris baru):</label>
                <textarea class="form-control" oninput="updateProd(${pIdx}, 'benefit', this.value)">${prod.benefit || ''}</textarea>
              </div>
              <div class="form-group">
                <label>Garansi:</label>
                <textarea class="form-control" oninput="updateProd(${pIdx}, 'garansi', this.value)">${prod.garansi || ''}</textarea>
              </div>
              <div class="form-group">
                <label>Deskripsi Lengkap:</label>
                <textarea class="form-control" oninput="updateProd(${pIdx}, 'deskripsi', this.value)">${prod.deskripsi || ''}</textarea>
              </div>
            </div>

            <div class="form-group" style="margin-top:10px;">
              <label style="color:#c084fc;">⚡ Varian Paket & Harga:</label>
              <div id="pkgs-${pIdx}">${pkgHtml}</div>
              <button class="btn-purple" onclick="addPkg(${pIdx})" style="padding: 6px 14px; font-size:12px; margin-top:6px;">+ Tambah Varian Paket</button>
            </div>
          </div>
        `;
      });
    }

    function updateProd(pIdx, field, val) {
      currentProducts[pIdx][field] = val;
    }

    function addProduct() {
      currentProducts.push({
        id: "prod_" + Date.now(),
        title: "Produk Baru",
        logo: "logo.png",
        startPrice: "Rp10.000",
        desc: "Deskripsi singkat produk baru.",
        benefit: "• Benefit utama 1
• Benefit utama 2",
        garansi: "• Garansi penuh selama masa aktif.",
        deskripsi: "Deskripsi lengkap mengenai produk ini.",
        packages: [
          { nama: "Paket 1 Bulan", harga: "Rp10.000" }
        ]
      });
      renderAdminList();
    }

    function removeProduct(pIdx) {
      if (confirm("Yakin ingin menghapus produk ini dari katalog?")) {
        currentProducts.splice(pIdx, 1);
        renderAdminList();
      }
    }

    function updatePkg(pIdx, pkgIdx, field, val) {
      currentProducts[pIdx].packages[pkgIdx][field] = val;
    }

    function addPkg(pIdx) {
      if (!currentProducts[pIdx].packages) {
        currentProducts[pIdx].packages = [];
      }
      currentProducts[pIdx].packages.push({ nama: "Paket Baru", harga: "Rp15.000" });
      renderAdminList();
    }

    function removePkg(pIdx, pkgIdx) {
      currentProducts[pIdx].packages.splice(pkgIdx, 1);
      renderAdminList();
    }

    function saveData() {
      localStorage.setItem('nevfa_custom_products', JSON.stringify(currentProducts));
      
      // Sediakan juga struktur lengkap untuk index.html agar sinkron dengan key nevfa_store_data
      const fullStoreData = {
        banners: ["banner1.jpg", "banner2.jpg", "banner3.jpg"],
        products: currentProducts
      };
      localStorage.setItem('nevfa_store_data', JSON.stringify(fullStoreData));

      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }

    window.onload = loadAdminData;
  </script>
</body>
</html>
